[package]
name = "algorithm-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
# —— Rust 工程专题：算法相关轻量库 ——
rayon = "1"                # 并行迭代器
itertools = "0.14"         # 迭代器增强算法
rand = "0.9"               # 随机数
petgraph = "0.7"           # 图算法
num-bigint = "0.4"         # 大整数运算
indexmap = "2"             # 保序哈希表
smallvec = "1"             # 栈上小向量

# —— Rust 工程专题：工程常用库 ——
serde = { version = "1", features = ["derive"] }  # 序列化框架
serde_json = "1"           # JSON 编解码
anyhow = "1"               # 应用层错误处理
thiserror = "2"            # 库错误类型派生
regex = "1"                # 正则表达式
chrono = "0.4"             # 日期时间

# —— Rust 工程专题：异步生态 ——
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "io-util"] }
futures = "0.3"            # 异步组合子
